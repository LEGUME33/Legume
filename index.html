<body data-page="overview">

<main class="tl-main">
  <div class="tl-page-head">
    <h1 class="tl-page-title">总览</h1>
    <p class="tl-page-desc">聚合工作与学习两大模块的今日进展。点击任意预览卡片可直达对应功能详情页；所有数据本地即时保存，并自动双向同步至 GitHub 私有仓库。</p>
  </div>

  <!-- 云端同步状态（顶栏指示器之外的详情条） -->
  <section id="ov-sync"></section>

  <!-- 工作模块预览 -->
  <h2 class="tl-section-title">工作模块 <small id="ov-work-date"></small></h2>
  <section class="tl-grid tl-grid--3" id="ov-work"></section>

  <!-- 学习模块预览 -->
  <h2 class="tl-section-title">学习模块 <small>今日学习 · 30 天打卡</small></h2>
  <section class="tl-grid tl-grid--3" id="ov-study-metrics"></section>
  <section style="margin-top:20px" id="ov-study-topics"></section>

  <!-- 操作记录 -->
  <h2 class="tl-section-title">最近操作 <small>多设备留痕 · 同步至 data/activity.json</small></h2>
  <section id="ov-activity"></section>
</main>
